# Builds an Android test app (APK) on every push to main, so you can install myHaul on an Android phone.
# Download it from the run's "Artifacts" on GitHub (Actions tab). Release builds for Google Play need a signing key. [Lehloma]
name: Android test build
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/core/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - name: Build the app (live Supabase project) and copy it into the Android project
        working-directory: apps/web
        run: npx vite build --mode live && npx cap sync android
      - name: Build the APK
        working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: myHaul-android-test
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
